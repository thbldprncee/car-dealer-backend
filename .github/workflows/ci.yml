name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and integration tests (Testcontainers)
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '*/build/reports/tests'

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [order-service, storage-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: car-dealer/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  api-scenario:
    name: HTTP scenario on the full stack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL, Kafka, Keycloak and both services
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Run http/car-dealer.http
        run: |
          docker run --rm --network host -v "$PWD/http":/workdir \
            jetbrains/intellij-http-client -v http-client.env.json -e local car-dealer.http

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color order-service storage-service | tail -300

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Deploy to Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind

      - name: Build the images and deploy them to a kind cluster
        run: deploy/k8s/deploy.sh

      - name: Run http/car-dealer.http against the cluster
        run: deploy/k8s/deploy.sh test

      - name: Restart both services under load, expect no failed request
        run: deploy/k8s/deploy.sh rollout-check

      - name: Cluster state and service logs
        if: failure()
        run: |
          kubectl --context kind-car-dealer -n car-dealer get pods,events -o wide
          kubectl --context kind-car-dealer -n car-dealer logs deployment/order-service --tail=200
          kubectl --context kind-car-dealer -n car-dealer logs deployment/storage-service --tail=200
