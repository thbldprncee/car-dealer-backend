apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-service
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/storage_db
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_ISSUER_URI: http://localhost:18180/realms/car-dealer
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/car-dealer/protocol/openid-connect/certs
  SERVER_PORT: "8081"
  GRPC_SERVER_PORT: "9090"
  # The storage-db-migrate Job applies the changelog before the rollout; Hibernate's
  # ddl-auto=validate still refuses to start against a schema that does not match.
  SPRING_LIQUIBASE_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
spec:
  type: NodePort
  selector:
    app: storage-service
  ports:
    - name: http
      port: 8081
      nodePort: 30081
    - name: grpc
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-service
  # New pods must pass readiness before an old one is taken away, so a rollout never drops
  # below two serving replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Wait for the database and the broker instead of crash-looping until they are up.
        - name: wait-for-dependencies
          image: ghcr.io/thbldprncee/car-dealer-storage-service:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z storage-db 5432 && nc -z kafka 9092; do echo waiting; sleep 2; done"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: storage-service
          image: ghcr.io/thbldprncee/car-dealer-storage-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: storage-service }
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9090
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # Endpoints are removed asynchronously; keep serving for a few seconds after SIGTERM
          # is scheduled so no request is routed to a pod that already stopped accepting them.
          # Spring Boot then shuts down gracefully and finishes requests in flight.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext: *restricted
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: storage-service
