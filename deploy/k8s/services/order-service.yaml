apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_ISSUER_URI: http://localhost:18180/realms/car-dealer
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/car-dealer/protocol/openid-connect/certs
  STORAGE_SERVICE_BASE_URL: http://storage-service:8081
  STORAGE_GRPC_HOST: storage-service
  STORAGE_GRPC_PORT: "9090"
  STORAGE_GRPC_TIMEOUT_MS: "2000"
  SERVER_PORT: "8080"
  # The order-db-migrate Job applies the changelog before the rollout.
  SPRING_LIQUIBASE_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-dependencies
          image: ghcr.io/thbldprncee/car-dealer-order-service:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z order-db 5432 && nc -z kafka 9092; do echo waiting; sleep 2; done"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: order-service
          image: ghcr.io/thbldprncee/car-dealer-order-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: order-service }
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext: *restricted
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
