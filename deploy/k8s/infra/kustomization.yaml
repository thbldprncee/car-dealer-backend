# Step 1 of deploy.sh: what the services depend on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-dealer

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  - kafka.yaml
  - keycloak.yaml

# The keycloak-realm ConfigMap is created by deploy.sh from docker/keycloak/car-dealer-realm.json,
# so compose and Kubernetes share one realm file.

labels:
  - pairs:
      app.kubernetes.io/part-of: car-dealer
