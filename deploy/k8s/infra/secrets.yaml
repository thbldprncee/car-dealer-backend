# Demo credentials, the same as in docker-compose. A real cluster would get these from a secret
# manager (External Secrets, Sealed Secrets, Vault) instead of a file in the repository.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  username: admin
  password: admin
